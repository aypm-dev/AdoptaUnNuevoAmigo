name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restaurar dependencias
      run: dotnet restore AdopcionAPI/AdopcionAPI.slnx
      
    - name: Compilar solución (API + Web)
      run: dotnet build AdopcionAPI/AdopcionAPI.slnx --no-restore
